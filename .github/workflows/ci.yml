name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # Defaults are [opened, synchronize, reopened]. Add ready_for_review
    # so a draft -> ready transition re-runs CI without an empty push;
    # keep synchronize explicit so every new commit on the PR triggers a
    # fresh run.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Name a cell by os+go alone on the default provider, so the six required
    # check contexts keep the names branch protection already lists; a
    # non-default provider cell appends its provider and is therefore a
    # distinct, unrequired context — visible in the PR's checks, but a bad day
    # at a third-party mint endpoint doesn't block a merge. (The truthy branch
    # of the ternary must be the non-empty string: an empty string is falsy in
    # GitHub expressions and would fall through to the other side.)
    name: ci (${{ matrix.os }}, ${{ matrix.go }}${{ matrix.provider != 'tunnel.pizza' && format(', {0}', matrix.provider) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x64 + arm64 across linux, windows, and macos, all pinned to discrete
        # image labels (no *-latest aliases) so every cell names an explicit
        # version — the GitHub-hosted ARM runners (free for public repos) only
        # exist as discrete labels, so pinning the rest keeps the matrix
        # consistent. macos-26-intel is x64 (Intel), macos-26 is arm64 (Apple
        # Silicon). Bumping an image label renames its check context, so update
        # the branch-protection required contexts when bumping. gofmt runs
        # Linux-only (see below), covering both Linux cells.
        os:
          - ubuntu-24.04
          - windows-2025
          - ubuntu-24.04-arm
          - windows-11-arm
          - macos-26-intel
          - macos-26
        # "stable" is whatever setup-go's `stable` alias resolves to. A "min"
        # variant (the go.mod floor, resolved symbolically by the goversion
        # step below, which still supports it) was dropped in #147 to halve
        # the matrix; re-add `min` here — and to the branch-protection
        # required contexts — if floor coverage earns its cost back.
        go: [stable]
        # The quick-tunnel mint provider, fed to the library through
        # LIBTUNNEL__CLOUDFLARE_PROVIDER below. Only the live tiers read it,
        # so the second provider is an `include` cell rather than a second
        # column: a full cross-product would re-run five identical offline
        # cells for no signal. It sits in the base matrix as a single value
        # so every cell names it (check contexts stay uniform), and the
        # include adds the one cell that exercises Cloudflare's own endpoint
        # end to end.
        provider: [tunnel.pizza]
        include:
          # Same platform as the scenario-tier cell (linux/amd64), so this
          # runs the whole live suite — scenarios and examples — against
          # api.trycloudflare.com.
          - os: ubuntu-24.04
            go: stable
            provider: api.trycloudflare.com
    defaults:
      run:
        # bash on Windows runners comes from git-for-windows (MSYS) and matches
        # the Linux job's shell semantics, so steps below don't need per-OS
        # branching for $(...) / [ -n ... ] / piping.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: resolve go version
        id: goversion
        # "min" → the `go X.Y` directive in go.mod (the declared floor).
        # Anything else (e.g. "stable") passes through unchanged so setup-go's
        # aliases keep working.
        run: |
          if [ "${{ matrix.go }}" = "min" ]; then
            v=$(awk '/^go [0-9]/ {print $2; exit}' go.mod)
            echo "version=$v" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ matrix.go }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: true

      - name: gofmt
        # Linux-only: actions/checkout on Windows normalizes line endings to
        # CRLF, which gofmt flags on every file. The Linux cells already
        # enforce gofmt on the canonical LF tree.
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      # The make targets export CGO_ENABLED=0 (see Makefile) — the library is
      # pure Go, and windows-11-arm runners ship an x86_64 gcc that can't
      # assemble runtime/cgo's arm64 stubs.
      - name: go vet
        run: make vet

      - name: go build
        run: make build

      - name: tests
        run: make test

      # All live-tier selection lives in the e2e package (#147): which tier a
      # platform runs — the full scenario suite on linux/amd64, the example
      # binaries on one variant of each OS family, nothing live elsewhere —
      # and the Dependabot exclusion (read from the event payload). A
      # `served: error code: 1033` failure here is edge route propagation
      # lag, not code — rerun the job.
      - name: e2e
        env:
          LIBTUNNEL__CLOUDFLARE_PROVIDER: ${{ matrix.provider }}
        run: make e2e

  # Race detector lane. Separate from the matrix because the detector needs
  # CGO (the matrix forces CGO_ENABLED=0 for cross-host determinism, and
  # windows-11-arm's gcc can't assemble runtime/cgo's arm64 stubs anyway).
  # Linux/amd64 with the module's Go floor is enough — the races this guards
  # are in shared package state, not platform-specific.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: race tests
        # The make target owns the lane's definition (CGO on for the
        # detector, -short to keep the e2e live cases skipped), so a CI race
        # find reproduces locally with the same command.
        run: make race

  release:
    needs: [ci, race]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Exposed so the downstream warm-proxy job knows the released tag and whether
    # the release was skipped.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    permissions:
      contents: write   # push tag + create release
      id-token: write   # cosign keyless signing via OIDC
      packages: write   # push the container image + its signature to ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: resolve tag
        id: tag
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Manual tag push (minor/major bumps): use the tag as-is.
            echo "tag=${GITHUB_REF_NAME}"      >> "$GITHUB_OUTPUT"
            echo "needs_push=false"            >> "$GITHUB_OUTPUT"
            echo "skip=false"                  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main push: skip release if the commit opted out or already has a tag.
          # Token must sit alone on its own line so prose mentioning it inline
          # (subjects, doc paragraphs) doesn't accidentally suppress the release.
          msg=$(git log -1 --pretty=%B)
          if grep -qE '^[[:space:]]*\[skip release\][[:space:]]*$' <<<"$msg"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Auto-bump patch from the latest v* tag (default v0.0.1 for first release).
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v0.0.1"
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=${next}"      >> "$GITHUB_OUTPUT"
          echo "needs_push=true"  >> "$GITHUB_OUTPUT"
          echo "skip=false"       >> "$GITHUB_OUTPUT"

      - name: push tag
        if: steps.tag.outputs.skip != 'true' && steps.tag.outputs.needs_push == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: create github release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes

      - name: install cosign
        if: steps.tag.outputs.skip != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: build release binaries
        if: steps.tag.outputs.skip != 'true'
        run: make dist VERSION="${{ steps.tag.outputs.tag }}"

      - name: sign and upload release binaries
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"

          # Cross-compiled launcher binaries plus their checksum manifest,
          # each signed with cosign in keyless mode (OIDC -> Fulcio cert ->
          # Rekor transparency log) — the .sigstore bundle carries signature,
          # cert, and log entry. Runs before "sign source archives" because
          # `make dist` recreates dist/ from scratch.
          for f in dist/libtunnel_* dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sigstore" "$f"
          done

          # Upload the whole dist/ in one pass: binaries, SHA256SUMS, and the
          # .sigstore bundles just written. A single glob avoids listing the
          # sigstores twice (dist/libtunnel_* would also match them), which
          # made gh reject the batch as duplicate assets.
          gh release upload "${tag}" dist/* --clobber

      - name: sign source archives
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          repo="${GITHUB_REPOSITORY}"
          mkdir -p dist

          # Pull the auto-generated source archives that GitHub publishes
          # alongside every tag, then sign them with cosign in keyless mode
          # (OIDC -> Fulcio cert -> Rekor transparency log). The signature,
          # cert, and Rekor entry are bundled in a single .sigstore file.
          for ext in tar.gz zip; do
            curl -fsSL "https://github.com/${repo}/archive/refs/tags/${tag}.${ext}" \
              -o "dist/${tag}.${ext}"
            cosign sign-blob --yes \
              --bundle "dist/${tag}.${ext}.sigstore" \
              "dist/${tag}.${ext}"
          done

          gh release upload "${tag}" \
            "dist/${tag}.tar.gz.sigstore" \
            "dist/${tag}.zip.sigstore"

      - name: set up buildx
        if: steps.tag.outputs.skip != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: log in to ghcr
        if: steps.tag.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image metadata
        id: meta
        if: steps.tag.outputs.skip != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # The release job resolves its own tag, so feed that to the semver
          # extractor via value= instead of letting it read github.ref.
          # The raw v-prefixed tag matches libtunnel.Version() exactly, so
          # `ghcr.io/cnuss/libtunnel:` + Version() resolves; the bare semver
          # tags are the conventional Docker form.
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest

      - name: build and push image
        id: image
        if: steps.tag.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Go cross-compiles inside the build stage (no QEMU), so both arches
          # are a fast native compile.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: sign image
        if: steps.tag.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Sign the multi-arch manifest by digest (keyless, like the archives
          # and binaries); cosign pushes the signature alongside the image in
          # ghcr, so `cosign verify` needs no separate artifact.
          cosign sign --yes \
            "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.image.outputs.digest }}"

  # Best-effort cache primer for pkg.go.dev, in its own job (needs: release) so a
  # transient proxy.golang.org 5xx can be re-run in isolation without touching the
  # already-published release. The release deliverables (tag, binaries, image) are
  # complete regardless; proxy.golang.org also fetches the tag on its own within
  # minutes. Unlike the old inline step this is allowed to fail — a red here is a
  # one-click rerun, not a false-failed release. See v0.0.34/v0.0.35.
  warm-proxy:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: warm proxy.golang.org
        run: |
          tag="${{ needs.release.outputs.tag }}"
          mod="github.com/${GITHUB_REPOSITORY}"
          for url in \
            "https://proxy.golang.org/${mod}/@v/${tag}.info" \
            "https://proxy.golang.org/${mod}/@v/${tag}.mod" \
            "https://sum.golang.org/lookup/${mod}@${tag}"; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "$url" >/dev/null
          done
