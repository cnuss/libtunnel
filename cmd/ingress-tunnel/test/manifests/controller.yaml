apiVersion: v1
kind: Namespace
metadata:
  name: ingress-tunnel-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-tunnel
  namespace: ingress-tunnel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingress-tunnel
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingress-tunnel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress-tunnel
subjects:
  - kind: ServiceAccount
    name: ingress-tunnel
    namespace: ingress-tunnel-system
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: tunnel
spec:
  controller: libtunnel.cnuss.github.io/ingress-tunnel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-tunnel
  namespace: ingress-tunnel-system
  labels:
    app: ingress-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-tunnel
  template:
    metadata:
      labels:
        app: ingress-tunnel
    spec:
      serviceAccountName: ingress-tunnel
      containers:
        - name: ingress-tunnel
          image: ingress-tunnel:poc
          imagePullPolicy: Never # image is kind-loaded, never pulled
          args: ["-ingress-class", "tunnel"]
